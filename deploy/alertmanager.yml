# Growth Agent — Alertmanager configuration.
#
# Ships with a NULL receiver so `--profile monitoring up` starts cleanly. Before
# you rely on alerting, replace `null` with a real receiver and point the route
# at it (DEPLOYMENT.md §16). Prometheus + these rules (deploy/alerts.yml) do the
# evaluating; Alertmanager only routes/dedupes/notifies.

global:
  resolve_timeout: 5m

route:
  receiver: 'null'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: 'null' # -> change to 'pager' once configured below
      repeat_interval: 1h

receivers:
  - name: 'null'

  # --- Wire ONE of these and update the routes above ----------------------
  # - name: 'slack'
  #   slack_configs:
  #     - api_url: '${SLACK_WEBHOOK_URL}'
  #       channel: '#alerts'
  #       send_resolved: true
  #       title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
  #       text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
  #
  # - name: 'pager'
  #   pagerduty_configs:
  #     - routing_key: '${PAGERDUTY_ROUTING_KEY}'
  #       severity: '{{ .CommonLabels.severity }}'

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname', 'service']
